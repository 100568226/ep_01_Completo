<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/style.css">
    <title>Ejercicio Practico 5</title>
</head>
<body>
    <header id="navBar">
        <div id="navContainer">
            <div id="logo">
                <img src="../media/logo.svg" alt="logo de la página">
            </div>
            <nav id="navegacion">
                <ul id="enlaces">
                    <li><a class="enlace" href="tarjeta.html">Tarjeta</a></li>
                    <li><a class="enlace" href="galeria.html">Galería</a></li>
                    <li><a class="enlace" href="registro.html" style="text-shadow: none; color: rgb(254, 94, 145);  text-decoration: none;">Registro</a></li>
                </ul>
                
            </nav>
        </div>
        
    </header>
    
    <section class="container">
        
        <form id="registro">
            <h1>Registro</h1>

            <label for="nombre">Nombre:</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                required
            >

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="password">Contraseña:</label>
            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                required
            >

            <button type="submit">Registrarse</button>
        </form>
    
        
    </section>
    <!-- Ejercicio 5 registro -->


</body>
</html>
